name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release runs the same checks on the commit it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  plugin:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ui/package.json
      - run: bun install --frozen-lockfile
      # Lint, type check, tests and the build the plugin embeds.
      - run: bun run verify

  band:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: curl -fsSL https://claude.ai/install.sh | bash
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude plugin validate .
      - run: claude plugin validate mod
      - run: claude plugin test mod

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh
      - run: python3 scripts/git-hooks/test_pre_commit.py
      - run: python3 scripts/test_usage_backfill.py
